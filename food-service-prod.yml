server:
  port: 9098
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jpa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Root@12345
    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true


info:
  app:
    name: "Food Service"
    description: "This is Food Service. Ready to serve users. This configurations is located in config server"
    version: "1.0 Production"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true


management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true